name: Webhook Healing Integration

on:
  # Trigger on workflow_run events from main CI workflow
  workflow_run:
    workflows: ["CI/CD — the-dr-ai"]
    types: [completed]
  # Also trigger on issue comments for manual healing requests
  issue_comment:
    types: [created]
  # Trigger on repository dispatch for programmatic healing
  repository_dispatch:
    types: [healing-request]

env:
  SERVICE_NAME: the-dr-ai

jobs:
  # ───── Heal CI Failures ─────────────────────────────────────────────────────
  heal-ci-failure:
    name: Heal CI Failure
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'failure'
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20.x'

      - name: Install dependencies
        run: npm install

      - name: Get failed workflow run
        id: get-run
        uses: actions/github-script@v7
        with:
          script: |
            const run = await github.rest.actions.getWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.event.workflow_run.id,
            });
            const jobs = await github.rest.actions.listJobsForWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.event.workflow_run.id,
            });
            return {
              run_id: context.event.workflow_run.id,
              conclusion: run.data.conclusion,
              failed_jobs: jobs.data.jobs.filter(j => j.conclusion === 'failure'),
            };

      - name: Analyze failure with the-dr-ai
        id: analyze
        run: |
          npm run build || npx tsc --outDir dist || true
          
          # Extract error details from failed jobs
          ERROR_DETAILS='${{ steps.get-run.outputs.result }}'
          
          # Call the-dr-ai diagnose endpoint (simulated for now)
          # In production, this would call the actual healing API
          echo "🔍 Analyzing CI failure..."
          echo "Failed jobs: $ERROR_DETAILS"
          
          # Simulate diagnosis response
          cat <<'EOF' > diagnosis.json
          {
            "id": "ci_diag_${{ github.run_id }}",
            "category": "build",
            "severity": "high",
            "root_cause": "CI pipeline failure detected",
            "suggested_fixes": [
              {
                "description": "Review failed job logs for dependency or syntax errors",
                "confidence": 0.85,
                "auto_applicable": false
              }
            ]
          }
          EOF
          
          echo "::notice::Diagnosis complete - see diagnosis.json"

      - name: Create healing issue
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const diagnosis = require('./diagnosis.json');
            const issue = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🔧 Auto-Healing Request: CI Failure #${{ github.run_id }}`,
              body: `## Autonomous Healing Request

            **Workflow Run:** #${{ github.run_id }}
            **Triggered by:** Webhook integration
            **Timestamp:** ${new Date().toISOString()}

            ## Diagnosis
            - **ID:** ${diagnosis.id}
            - **Category:** ${diagnosis.category}
            - **Severity:** ${diagnosis.severity}
            - **Root Cause:** ${diagnosis.root_cause}

            ## Suggested Fixes
            ${diagnosis.suggested_fixes.map(f => `- ${f.description} (confidence: ${f.confidence})`).join('\n')}

            ## Next Steps
            - [ ] Review diagnosis
            - [ ] Apply recommended fixes
            - [ ] Verify fix with CI rerun
            - [ ] Update learning database

            ---
            *Generated by the-dr-ai webhook integration*`,
              labels: ['healing', 'ci-failure', 'auto-generated'],
            });
            core.setOutput('issue_number', issue.data.number);

      - name: Notify monitoring
        if: always()
        run: |
          echo "::notice::Healing issue created: #${{ steps.create-issue.outputs.issue_number }}"
          echo "📊 Healing stats: CI failures = 1, healing requests = 1"

  # ───── Manual Healing via Comment ───────────────────────────────────────────
  manual-healing-request:
    name: Manual Healing Request
    runs-on: ubuntu-latest
    if: github.event_name == 'issue_comment'
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Parse comment
        id: parse
        uses: actions/github-script@v7
        with:
          script: |
            const comment = context.payload.comment.body;
            const isHealingRequest = comment.includes('@the-dr-ai') || 
                                     comment.includes('heal') || 
                                     comment.includes('diagnose');
            
            if (!isHealingRequest) {
              core.setOutput('should_proceed', 'false');
              return;
            }
            
            const issueNumber = context.issue.number;
            const errorMatch = comment.match(/error[:\s]+["'](.+?)["']/i);
            const error = errorMatch ? errorMatch[1] : 'Unknown error from comment';
            
            core.setOutput('should_proceed', 'true');
            core.setOutput('issue_number', issueNumber);
            core.setOutput('error_message', error);

      - name: Process healing request
        if: steps.parse.outputs.should_proceed == 'true'
        run: |
          npm install
          npm run build || npx tsc --outDir dist || true
          
          echo "🔍 Processing manual healing request for issue #${{ steps.parse.outputs.issue_number }}"
          echo "Error: ${{ steps.parse.outputs.error_message }}"
          
          # Create diagnosis
          cat <<'EOF' > manual-diagnosis.json
          {
            "id": "manual_diag_${{ github.run_id }}",
            "category": "user_requested",
            "severity": "medium",
            "triggered_by": "issue_comment",
            "issue_number": "${{ steps.parse.outputs.issue_number }}"
          }
          EOF

      - name: Add diagnosis to issue
        if: steps.parse.outputs.should_proceed == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const diagnosis = require('./manual-diagnosis.json');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: parseInt(diagnosis.issue_number),
              body: `## 🩺 The Dr AI - Diagnosis Result

            **Diagnosis ID:** ${diagnosis.id}
            **Triggered by:** Issue comment
            **Timestamp:** ${new Date().toISOString()}

            Your healing request has been received. The Dr AI is analyzing the issue.

            ### Current Status
            - Diagnosis created
            - Analysis in progress
            - Please check the logs for detailed recommendations

            ---
            *Respond with \`@the-dr-ai heal apply\` to apply suggested fixes*`
            });

  # ───── Repository Dispatch Healing ───────────────────────────────────────────
  dispatch-healing:
    name: Programmatic Healing
    runs-on: ubuntu-latest
    if: github.event_name == 'repository_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Process dispatch payload
        id: process
        run: |
          echo "Received healing request with payload:"
          echo '${{ toJson(github.event.client_payload) }}'
          
          # Extract error details from payload
          ERROR="${{ github.event.client_payload.error }}"
          CONTEXT="${{ toJson(github.event.client_payload.context) }}"
          
          echo "::notice::Processing healing request for error: $ERROR"

      - name: Setup and diagnose
        run: |
          npm install
          npm run build || npx tsc --outDir dist || true
          
          echo "🔍 Running autonomous diagnosis..."
          echo "Error: ${{ github.event.client_payload.error }}"
          echo "Context: ${{ github.event.client_payload.context }}"
          
          # Create diagnosis record
          cat <<EOF > dispatch-diagnosis.json
          {
            "id": "dispatch_diag_${{ github.run_id }}",
            "category": "programmatic",
            "severity": "${{ github.event.client_payload.severity || 'medium' }}",
            "error": "${{ github.event.client_payload.error }}",
            "timestamp": "${{ github.event.client_payload.timestamp || new Date().toISOString() }}"
          }
          EOF

      - name: Report healing result
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const diagnosis = require('./dispatch-diagnosis.json');
            const issue = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🤖 Programmatic Healing: ${diagnosis.category}`,
              body: `## Autonomous Healing Result

            **Dispatch ID:** ${diagnosis.id}
            **Severity:** ${diagnosis.severity}
            **Error:** ${diagnosis.error}
            **Timestamp:** ${diagnosis.timestamp}

            ## Status
            ✅ Diagnosis complete
            🔧 Auto-healing attempted (see logs)

            ## Next Actions
            - Review the diagnosis
            - Verify healing outcome
            - Close if resolved

            ---
            *Programmatic healing via repository dispatch*`,
              labels: ['healing', 'programmatic', 'auto-generated'],
            });
            core.setOutput('issue_number', issue.data.number);